<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;background:linear-gradient(#f3f1ec,#d8d5ce)}#w{width:1280px;height:720px}</style></head>
<body><div id="w"><canvas id="c" style="width:100%;height:100%"></canvas></div>
<script type="module">
// Dev-only lab page: renders a config so we can screenshot or export stills.
import { CarScene } from '/src/three/CarScene.ts';
import { normalizeConfig, DEFAULT_CONFIG } from '/shared/catalog.js';
const q = new URLSearchParams(location.search);
const films = await (await fetch('/api/films')).json();
const s = new CarScene(document.getElementById('c'), { interactive: true });
s.setFilms(films);
window.render = (cfg, view = 'hero', zoom = 1) => {
  s.setConfig(normalizeConfig(cfg));
  s.camera.position.set(...s.view(view).map((v) => v * zoom));
  s.camera.lookAt(0, s.targetY, 0);
  if (s.controls) s.controls.update();
};
window.snap = (w, h) => s.snapshot(w, h, 'image/webp', true);
window.render({ ...DEFAULT_CONFIG, model: q.get('model') || DEFAULT_CONFIG.model, env: q.get('env') || 'studio', stripes: q.get('stripes') || 'none', zones: { body: q.get('film') || DEFAULT_CONFIG.zones.body, roof: q.get('roof') } }, q.get('view') || 'hero');
window.__ready = true;
</script></body></html>
